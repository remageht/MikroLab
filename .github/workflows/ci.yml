name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  windows:
    name: Windows (full solution)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build solution
        run: dotnet build MikroLab.sln -c Release -v minimal
      - name: Run tests
        run: dotnet run --project tests/MikroLab.Tests/MikroLab.Tests.csproj -c Release --no-build
      - name: CLI smoke check
        run: dotnet run --project src/MikroLab.Cli/MikroLab.Cli.csproj -c Release --no-build -- version
      - name: CLI lab check
        run: dotnet run --project src/MikroLab.Cli/MikroLab.Cli.csproj -c Release --no-build -- lab 1
      - name: CLI info check
        run: dotnet run --project src/MikroLab.Cli/MikroLab.Cli.csproj -c Release --no-build -- info

  cross-platform:
    name: ${{ matrix.os }} (Core + Presentation + Avalonia + CLI + tests)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build Core
        run: dotnet build src/MikroLab.Core/MikroLab.Core.csproj -c Release -v minimal
      - name: Build Presentation
        run: dotnet build src/MikroLab.Presentation/MikroLab.Presentation.csproj -c Release -v minimal
      - name: Build Avalonia studio
        run: dotnet build src/MikroLab.Avalonia/MikroLab.Avalonia.csproj -c Release -v minimal
      - name: Build CLI
        run: dotnet build src/MikroLab.Cli/MikroLab.Cli.csproj -c Release -v minimal
      - name: Build tests
        run: dotnet build tests/MikroLab.Tests/MikroLab.Tests.csproj -c Release -v minimal
      - name: Run tests
        run: dotnet run --project tests/MikroLab.Tests/MikroLab.Tests.csproj -c Release --no-build
      - name: CLI smoke check
        run: dotnet run --project src/MikroLab.Cli/MikroLab.Cli.csproj -c Release --no-build -- version
      - name: CLI lab check
        run: dotnet run --project src/MikroLab.Cli/MikroLab.Cli.csproj -c Release --no-build -- lab 1
      - name: CLI info check
        run: dotnet run --project src/MikroLab.Cli/MikroLab.Cli.csproj -c Release --no-build -- info
      - name: Screenshot smoke check (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb
          xvfb-run -a -s "-screen 0 1600x1000x24" \
            dotnet run --project src/MikroLab.Avalonia/MikroLab.Avalonia.csproj -c Release --no-build -- \
            --capture "$RUNNER_TEMP/mikrolab-screens" --sample 0 --workspace studio
          ls -la "$RUNNER_TEMP/mikrolab-screens"

      - name: Smoke test of the published Linux build
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb
          dotnet publish src/MikroLab.Avalonia/MikroLab.Avalonia.csproj \
            -c Release \
            -r linux-x64 \
            --self-contained true \
            -p:PublishSingleFile=true \
            -p:IncludeNativeLibrariesForSelfExtract=true \
            -p:EnableCompressionInSingleFile=true \
            -p:DebugType=None \
            -p:DebugSymbols=false \
            -o "$RUNNER_TEMP/publish/linux-x64"
          ls -la "$RUNNER_TEMP/publish/linux-x64"
          for workspace in studio laboratory i8086 x64; do
            echo "::group::smoke $workspace"
            set +e
            xvfb-run -a -s "-screen 0 1600x1000x24" \
              "$RUNNER_TEMP/publish/linux-x64/MikroLab" --smoke --workspace "$workspace"
            code=$?
            set -e
            echo "::endgroup::"
            if [ "$code" -ne 0 ]; then
              echo "smoke test of the $workspace workspace failed with the code $code"
              exit "$code"
            fi
          done

      - name: Smoke test of the published macOS build
        if: runner.os == 'macOS'
        run: |
          dotnet publish src/MikroLab.Avalonia/MikroLab.Avalonia.csproj \
            -c Release \
            -r osx-arm64 \
            --self-contained true \
            -p:PublishSingleFile=true \
            -p:IncludeNativeLibrariesForSelfExtract=true \
            -p:EnableCompressionInSingleFile=true \
            -p:DebugType=None \
            -p:DebugSymbols=false \
            -o "$RUNNER_TEMP/publish/osx-arm64"
          ls -la "$RUNNER_TEMP/publish/osx-arm64"
          for workspace in studio x64; do
            echo "::group::smoke $workspace"
            set +e
            "$RUNNER_TEMP/publish/osx-arm64/MikroLab" --smoke --workspace "$workspace"
            code=$?
            set -e
            echo "::endgroup::"
            if [ "$code" -ne 0 ]; then
              echo "smoke test of the $workspace workspace failed with the code $code"
              exit "$code"
            fi
          done
