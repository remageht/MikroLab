name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build, for example v0.2.0"
        required: true
        type: string

permissions:
  contents: write

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  test:
    name: Build and test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref }}
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build solution
        run: dotnet build MikroLab.sln -c Release -v minimal

      - name: Run tests
        run: dotnet run --project tests/MikroLab.Tests/MikroLab.Tests.csproj -c Release --no-build

      - name: CLI smoke checks
        run: |
          dotnet run --project src/MikroLab.Cli/MikroLab.Cli.csproj -c Release --no-build -- version
          dotnet run --project src/MikroLab.Cli/MikroLab.Cli.csproj -c Release --no-build -- lab 1
          dotnet run --project src/MikroLab.Cli/MikroLab.Cli.csproj -c Release --no-build -- info

  studio:
    name: Windows studio
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref }}
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Resolve tag and version
        shell: pwsh
        run: |
          $tag = if ("${{ github.event_name }}" -eq "workflow_dispatch") { "${{ github.event.inputs.tag }}" } else { $env:GITHUB_REF_NAME }
          $version = $tag -replace '^v', ''
          "TAG=$tag" | Out-File -FilePath $env:GITHUB_ENV -Append
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Publish studio
        shell: pwsh
        run: |
          dotnet publish src/MikroLab.App/MikroLab.App.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            --source https://api.nuget.org/v3/index.json `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true `
            -p:DebugType=None `
            -p:DebugSymbols=false `
            -p:Version="$env:VERSION" `
            -o publish/studio-win-x64
          Get-Item publish/studio-win-x64/MikroLab.exe | Select-Object Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: studio-win-x64
          path: publish/studio-win-x64/MikroLab.exe
          if-no-files-found: error

  studio-cross:
    name: Studio ${{ matrix.rid }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
            platform: linux
          - os: ubuntu-latest
            rid: linux-arm64
            platform: linux
          - os: macos-latest
            rid: osx-x64
            platform: osx
          - os: macos-latest
            rid: osx-arm64
            platform: osx
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref }}
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Resolve tag and version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          VERSION="${TAG#v}"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Publish Avalonia studio
        shell: bash
        run: |
          dotnet publish src/MikroLab.Avalonia/MikroLab.Avalonia.csproj \
            -c Release \
            -r "${{ matrix.rid }}" \
            --self-contained true \
            -p:PublishSingleFile=true \
            -p:IncludeNativeLibrariesForSelfExtract=true \
            -p:EnableCompressionInSingleFile=true \
            -p:DebugType=None \
            -p:DebugSymbols=false \
            -p:Version="$VERSION" \
            -o "publish/${{ matrix.rid }}"
          ls -la "publish/${{ matrix.rid }}"

      - name: Package Linux tarball
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          mkdir -p package
          cp "publish/${{ matrix.rid }}/MikroLab" package/MikroLab
          cp LICENSE THIRD-PARTY-NOTICES.md README.md package/
          chmod +x package/MikroLab
          tar -czf "MikroLab-${{ matrix.rid }}.tar.gz" -C package .
          ls -lh "MikroLab-${{ matrix.rid }}.tar.gz"

      - name: Package macOS app bundle
        if: matrix.platform == 'osx'
        shell: bash
        run: |
          APP="MikroLab.app/Contents"
          mkdir -p "$APP/MacOS" "$APP/Resources"
          cp "publish/${{ matrix.rid }}/MikroLab" "$APP/MacOS/MikroLab"
          cp LICENSE THIRD-PARTY-NOTICES.md README.md "$APP/Resources/"
          chmod +x "$APP/MacOS/MikroLab"
          cat > "$APP/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key><string>MikroLab</string>
            <key>CFBundleDisplayName</key><string>MikroLab</string>
            <key>CFBundleIdentifier</key><string>com.mikrolab.studio</string>
            <key>CFBundleVersion</key><string>$VERSION</string>
            <key>CFBundleShortVersionString</key><string>$VERSION</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleExecutable</key><string>MikroLab</string>
            <key>CFBundleInfoDictionaryVersion</key><string>6.0</string>
            <key>LSMinimumSystemVersion</key><string>12.0</string>
            <key>NSHighResolutionCapable</key><true/>
          </dict>
          </plist>
          PLIST
          tar -czf "MikroLab-${{ matrix.rid }}.tar.gz" MikroLab.app
          ls -lh "MikroLab-${{ matrix.rid }}.tar.gz"

      - uses: actions/upload-artifact@v4
        with:
          name: studio-${{ matrix.rid }}
          path: MikroLab-${{ matrix.rid }}.tar.gz
          if-no-files-found: error

  release:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    needs: [test, studio, studio-cross]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref }}

      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Prepare release notes
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          cat > release-notes.md <<'NOTES'
          ## MikroLab {{TAG}} — тестовая версия

          Первый тестовый предрелиз MikroLab с обновлённой консольной средой.

          ### Что нового

          - Команда `lab 1..7` с автоматической проверкой лабораторных работ 1–4.
          - Команды `disasm` и `info` для дизассемблирования и справки по карте памяти.
          - Русская справка CLI и единый русский вывод команд.
          - Выбор профиля процессора: `--profile legacy|newest`.
          - Windows-сборка MikroLab Studio и кроссплатформенные сборки для Linux/macOS.

          ### Состав релиза

          | Файл | Платформа | Содержимое |
          | --- | --- | --- |
          | `MikroLab.exe` | Windows x64 | MikroLab Studio (WinForms), один файл |
          | `MikroLab-linux-x64.tar.gz` | Linux x64 | MikroLab (Avalonia), LICENSE, THIRD-PARTY-NOTICES.md, README.md |
          | `MikroLab-linux-arm64.tar.gz` | Linux ARM64 | MikroLab (Avalonia), LICENSE, THIRD-PARTY-NOTICES.md, README.md |
          | `MikroLab-osx-x64.tar.gz` | macOS Intel | MikroLab.app, LICENSE, THIRD-PARTY-NOTICES.md, README.md |
          | `MikroLab-osx-arm64.tar.gz` | macOS Apple Silicon (M1–M4) | MikroLab.app, LICENSE, THIRD-PARTY-NOTICES.md, README.md |

          ### Быстрый старт

          **Windows:** запустите `MikroLab.exe`.

          **Linux:**

          ```bash
          tar -xzf MikroLab-linux-x64.tar.gz
          ./MikroLab
          ```

          **macOS:**

          ```bash
          tar -xzf MikroLab-osx-arm64.tar.gz
          open MikroLab.app
          ```

          При необходимости снимите карантин: `xattr -d com.apple.quarantine MikroLab.app`.

          ### Ограничения

          - Это тестовая версия (`beta`), возможны ошибки и изменение интерфейса.
          - CLI не входит в релизные архивы и предназначен для разработки и автоматизации.
          - На macOS приложение не подписано; для запуска может потребоваться разрешение Gatekeeper.

          ### Проверка

          Перед публикацией выполняются тесты `MikroLab.Tests` и smoke-проверки CLI (`version`, `lab 1`, `info`).

          Лицензия: GNU GPL v3. Исходный код: https://github.com/remageht/MikroLab
          NOTES
          sed -i "s/{{TAG}}/$TAG/g" release-notes.md

      - name: Upload release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          PRERELEASE=""
          case "$TAG" in
            *-*) PRERELEASE="--prerelease" ;;
          esac
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "MikroLab $TAG" --notes-file release-notes.md $PRERELEASE
          else
            gh release create "$TAG" --title "MikroLab $TAG" --notes-file release-notes.md $PRERELEASE
          fi
          gh release upload "$TAG" release-assets/* --clobber
