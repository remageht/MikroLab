name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build, for example v0.2.0"
        required: true
        type: string

permissions:
  contents: write

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  test:
    name: Build and test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref }}
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build solution
        run: dotnet build MikroLab.sln -c Release -v minimal

      - name: Run tests
        run: dotnet run --project tests/MikroLab.Tests/MikroLab.Tests.csproj -c Release --no-build

      - name: CLI smoke checks
        run: |
          dotnet run --project src/MikroLab.Cli/MikroLab.Cli.csproj -c Release --no-build -- version
          dotnet run --project src/MikroLab.Cli/MikroLab.Cli.csproj -c Release --no-build -- lab 1
          dotnet run --project src/MikroLab.Cli/MikroLab.Cli.csproj -c Release --no-build -- info

  studio:
    name: Windows studio
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref }}
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Resolve tag and version
        shell: pwsh
        run: |
          $tag = if ("${{ github.event_name }}" -eq "workflow_dispatch") { "${{ github.event.inputs.tag }}" } else { $env:GITHUB_REF_NAME }
          $version = $tag -replace '^v', ''
          "TAG=$tag" | Out-File -FilePath $env:GITHUB_ENV -Append
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Publish studio
        shell: pwsh
        run: |
          dotnet publish src/MikroLab.App/MikroLab.App.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            --source https://api.nuget.org/v3/index.json `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true `
            -p:DebugType=None `
            -p:DebugSymbols=false `
            -p:Version="$env:VERSION" `
            -o publish/studio-win-x64
          Get-Item publish/studio-win-x64/MikroLab.exe | Select-Object Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: studio-win-x64
          path: publish/studio-win-x64/MikroLab.exe
          if-no-files-found: error

  studio-cross:
    name: Studio ${{ matrix.rid }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
            platform: linux
          - os: ubuntu-latest
            rid: linux-arm64
            platform: linux
          - os: macos-latest
            rid: osx-x64
            platform: osx
          - os: macos-latest
            rid: osx-arm64
            platform: osx
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref }}
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Resolve tag and version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          VERSION="${TAG#v}"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Publish Avalonia studio
        shell: bash
        run: |
          dotnet publish src/MikroLab.Avalonia/MikroLab.Avalonia.csproj \
            -c Release \
            -r "${{ matrix.rid }}" \
            --self-contained true \
            -p:PublishSingleFile=true \
            -p:IncludeNativeLibrariesForSelfExtract=true \
            -p:EnableCompressionInSingleFile=true \
            -p:DebugType=None \
            -p:DebugSymbols=false \
            -p:Version="$VERSION" \
            -o "publish/${{ matrix.rid }}"
          ls -la "publish/${{ matrix.rid }}"

      - name: Package Linux tarball
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          mkdir -p package
          cp "publish/${{ matrix.rid }}/MikroLab" package/MikroLab
          cp LICENSE THIRD-PARTY-NOTICES.md README.md package/
          chmod +x package/MikroLab
          tar -czf "MikroLab-${{ matrix.rid }}.tar.gz" -C package .
          ls -lh "MikroLab-${{ matrix.rid }}.tar.gz"

      - name: Package macOS app bundle
        if: matrix.platform == 'osx'
        shell: bash
        run: |
          APP="MikroLab.app/Contents"
          mkdir -p "$APP/MacOS" "$APP/Resources"
          cp "publish/${{ matrix.rid }}/MikroLab" "$APP/MacOS/MikroLab"
          cp LICENSE THIRD-PARTY-NOTICES.md README.md "$APP/Resources/"
          cp assets/mikrolab.icns "$APP/Resources/"
          chmod +x "$APP/MacOS/MikroLab"
          cat > "$APP/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key><string>MikroLab</string>
            <key>CFBundleDisplayName</key><string>MikroLab</string>
            <key>CFBundleIdentifier</key><string>com.mikrolab.studio</string>
            <key>CFBundleVersion</key><string>$VERSION</string>
            <key>CFBundleShortVersionString</key><string>$VERSION</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleExecutable</key><string>MikroLab</string>
          <key>CFBundleIconFile</key><string>mikrolab.icns</string>
            <key>CFBundleInfoDictionaryVersion</key><string>6.0</string>
            <key>LSMinimumSystemVersion</key><string>12.0</string>
            <key>NSHighResolutionCapable</key><true/>
          </dict>
          </plist>
          PLIST
          tar -czf "MikroLab-${{ matrix.rid }}.tar.gz" MikroLab.app
          ls -lh "MikroLab-${{ matrix.rid }}.tar.gz"

      - uses: actions/upload-artifact@v4
        with:
          name: studio-${{ matrix.rid }}
          path: MikroLab-${{ matrix.rid }}.tar.gz
          if-no-files-found: error

  release:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    needs: [test, studio, studio-cross]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref }}

      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Prepare release notes
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          cat > release-notes.md <<'NOTES'
          ## MikroLab {{TAG}} — студия с архитектурами Intel 8086 и x86-64

          Релиз с полноценной поддержкой 16-разрядных архитектур: Intel 8086 и
          x86-64 в режиме long mode. Эмулятор работает с тремя процессорами —
          КР580ВМ80А (Intel 8080), Intel 8086 и Intel x86-64.

          ### Что нового

          - **Ядро Intel 8086** — полный набор команд 8086 в реальном режиме:
            `IMUL` и `IDIV` считают в паре `DX:AX`, строковые операции работают с
            префиксами `REP`, переполнение 16-разрядного сложения определяется
            аппаратным флагом `OF` (проверка `JO` / `JNO`), есть вектор прерываний;
          - **Ядро Intel x86-64** — long mode: REX-префиксы, 64-битные операнды,
            RIP-относительная адресация, байт SIB, 64-битные `MUL` и `DIV`
            (`RDX:RAX`), `SETcc` и `CMOVcc`, `MOVZX` / `MOVSX` / `MOVSXD`,
            разреженная память на 1 МБ и выше;
          - **Ассемблеры Intel-синтаксиса** для обеих архитектур: `ORG`, `DB` / `DW` /
            `DD` / `DQ`, `TIMES`, `EQU`, `RESB` / `RESW` / `RESD` / `RESQ`, `%INCLUDE`,
            выражения и релаксация переходов между короткой и длинной формой.
            Кодировка совпадает с NASM **байт в байт**;
          - **Сервисы DOS** `INT 21h` и `INT 16h` — программы в формате `.COM`
            выполняются прямо в эмуляторе и печатают результат в окно вывода;
          - **Рабочие области «i8086» и «x64»** в обеих студиях (WinForms и Avalonia):
            редактор исходного текста, регистры, сегментные регистры, флаги, дамп
            памяти и окно вывода программы;
          - **Переключатель архитектур** в шапке студии: Студия · Лаборатория · i8086 ·
            x64. Подпись под логотипом меняется вместе с вкладкой и показывает
            текущую архитектуру;
          - **Дизассемблирование** собранной программы — адрес, байты каждой команды и
            строка исходника;
          - **Диалог «Настройки»** в студии: скорость, трассировка, адрес загрузки,
            автосборка и автодизассемблирование при открытии файла, тумблеры стенда,
            масштаб шрифта; настройки хранятся в профиле пользователя;
          - **CLI**: `--arch i8086|x64` для команд `assemble` и `run`, `--origin` для
            адреса загрузки, а также `--workspace`, `--program` и `--run` для студии;
          - **Значок приложения** для Windows, Linux и macOS — по мотивам знака
            в шапке студии;
          - **Проверка обновлений** при старте: студия спрашивает GitHub о
            свежем релизе и предлагает открыть его страницу.

          ### Сборки

          | Файл | Платформа | Что внутри |
          | --- | --- | --- |
          | `MikroLab.exe` | Windows x64 | MikroLab Studio (WinForms), один файл |
          | `MikroLab-linux-x64.tar.gz` | Linux x64 | MikroLab (Avalonia), один файл, LICENSE, README |
          | `MikroLab-linux-arm64.tar.gz` | Linux ARM64 | MikroLab (Avalonia), один файл, LICENSE, README |
          | `MikroLab-osx-x64.tar.gz` | macOS Intel | MikroLab.app, LICENSE, README |
          | `MikroLab-osx-arm64.tar.gz` | macOS Apple Silicon | MikroLab.app, LICENSE, README |

          ### Проверено

          - кодировка ассемблеров i8086 и x64 совпадает с NASM байт в байт;
          - автоматические тесты ядер: арифметика, флаги, переполнение, вызовы,
            строковые операции, RIP-относительные адреса и вывод DOS;
          - все тесты проекта проходят без ошибок.
          NOTES
          sed -i "s/{{TAG}}/$TAG/g" release-notes.md

      - name: Upload release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          PRERELEASE=""
          case "$TAG" in
            *-*) PRERELEASE="--prerelease" ;;
          esac
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "MikroLab $TAG" --notes-file release-notes.md $PRERELEASE
          else
            gh release create "$TAG" --title "MikroLab $TAG" --notes-file release-notes.md $PRERELEASE
          fi
          gh release upload "$TAG" release-assets/* --clobber
